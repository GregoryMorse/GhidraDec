name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ida_versions:
        description: "Public IDA SDK versions to build: 9.3, 9.4, future tagged SDKs, latest, or all"
        type: string
        default: "latest"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          args=()
          versions="${{ github.event.inputs.ida_versions }}"
          if [[ -z "$versions" ]]; then
            versions="latest"
          fi
          if [[ "$versions" == "all" ]]; then
            args+=(--all)
          else
            args+=(--versions "$versions")
          fi
          if ! matrix_json="$(python tools/ida_sdk.py matrix "${args[@]}")"; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ needs.matrix.result == 'success' && needs.matrix.outputs.matrix != '' && fromJson(needs.matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare IDA SDK
        shell: bash
        run: python tools/ida_sdk.py ensure --version "${{ matrix.ida }}"

      - name: Prepare Ghidra decompiler sources
        shell: bash
        run: python tools/deps.py ensure-ghidra-sources

      - name: Configure
        shell: bash
        run: cmake -S . -B "build/ida-${{ matrix.ida }}" -DGHIDRADEC_IDA_VERSION="${{ matrix.ida }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build "build/ida-${{ matrix.ida }}" --config Release --parallel

      - name: Package
        shell: bash
        run: cmake --build "build/ida-${{ matrix.ida }}" --config Release --target package_plugins

      - uses: actions/upload-artifact@v4
        with:
          name: ghidradec-ida${{ matrix.ida }}-${{ matrix.os }}
          path: build/ida-${{ matrix.ida }}/artifacts/*.zip
          if-no-files-found: error
