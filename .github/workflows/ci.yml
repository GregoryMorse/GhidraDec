name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ida_versions:
        description: "Public SDKs: 9.5, 9.4sp1, exact tags (v9.4.0-sdk.1), comma lists, latest, or all"
        type: string
        default: "9.5"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test build helpers
        run: python -m unittest discover -s tests/unit -p "test_*.py"
      - id: matrix
        shell: bash
        env:
          REQUESTED_VERSIONS: ${{ inputs.ida_versions }}
        run: |
          args=()
          versions="$REQUESTED_VERSIONS"
          if [[ -z "$versions" ]]; then
            versions="9.5"
          fi
          if [[ "$versions" == "all" ]]; then
            args+=(--all)
          else
            args+=(--versions "$versions")
          fi
          if ! matrix_json="$(python tools/ida_sdk.py matrix "${args[@]}")"; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ needs.matrix.result == 'success' && needs.matrix.outputs.matrix != '' && fromJson(needs.matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/public-dependencies
        with:
          ida: ${{ matrix.ida }}
          sdk_dir: ${{ matrix.sdk_dir }}
          sdk_source: ${{ matrix.sdk_source }}

      - name: Configure
        shell: bash
        run: |
          configure_args=(-S . -B "build/ida-${{ matrix.ida }}" -DGHIDRADEC_IDA_VERSION="${{ matrix.ida }}" -DCMAKE_BUILD_TYPE=Release)
          if [[ -n "${{ matrix.cmake_platform }}" ]]; then
            configure_args+=(-A "${{ matrix.cmake_platform }}")
          fi
          if [[ -n "${{ matrix.cmake_osx_arch }}" ]]; then
            configure_args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_osx_arch }}")
          fi
          cmake "${configure_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build "build/ida-${{ matrix.ida }}" --config Release --parallel

      - name: Package
        shell: bash
        run: cmake --build "build/ida-${{ matrix.ida }}" --config Release --target package_plugins

      - name: Test
        run: ctest --test-dir "build/ida-${{ matrix.ida }}" -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: ghidradec-ida${{ matrix.ida }}-${{ matrix.os }}-${{ matrix.host_arch }}
          path: build/ida-${{ matrix.ida }}/artifacts/*.zip
          if-no-files-found: error
